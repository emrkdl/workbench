[project]
name = "boardlens"
version = "0.1.0"
description = "PCB Design Workbench (BoardLens) backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
boardlens = "boardlens.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
